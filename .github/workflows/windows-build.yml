name: Windows build

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: msys2 {0}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git autoconf automake libtool m4 make patch zip curl
          pacboy: >-
            gcc:p pkgconf:p libevent:p openssl:p zlib:p xz:p zstd:p

      - name: Download source
        run: |
          DEST=tor-src
          REPO_URL="https://gitlab.torproject.org/tpo/core/tor.git"
          if [ -e "$DEST" ]; then
            rm -rf "$DEST"
          fi
          git clone "$REPO_URL" "$DEST"
          echo "cloned into: $DEST"
          git -C "$DEST" log --oneline -1

      - name: Apply fork patches
        run: |
          cd tor-src
          for p in ../patches/*.patch; do
            echo "== $p"
            git apply --verbose "$p"
          done

      - name: Configure and build
        run: |
          cd tor-src
          autoreconf -fi
          mkdir -p ../build
          cd ../build
          ZSTD_CFLAGS='-L/mingw64/include' ZSTD_LIBS='-L/mingw64/lib -lzstd' \
            ../tor-src/configure \
              --build=x86_64-w64-mingw32 \
              --host=x86_64-w64-mingw32 \
              --with-openssl-dir=/mingw64 \
              --disable-asciidoc \
              --disable-gcc-hardening \
              CFLAGS='-D__USE_MINGW_ANSI_STDIO=0'
          make -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist/data
          cp build/src/app/tor.exe dist/
          cp torrc dist/
          ldd build/src/app/tor.exe | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
            [ -f "$dll" ] && cp "$dll" dist/
          done
          curl -fL --retry 3 https://dist.torproject.org/geoip -o dist/data/geoip
          curl -fL --retry 3 https://dist.torproject.org/geoipv6 -o dist/data/geoipv6
          (cd dist && zip -9 -r ../tor-windows-x86_64.zip .)
          ./dist/tor.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-windows-x86_64
          path: tor-windows-x86_64.zip

      - name: Upload config log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-log
          path: build/config.log
